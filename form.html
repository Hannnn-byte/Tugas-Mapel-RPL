<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Formulir Pendaftaran</title>
</head>
<body>
    <form action="#" method="POST">
        <table>
            <tr>
                <td><label for="nama_siswa">Nama Siswa</label></td>
                <td>:</td>
                <td><input type="text" id="nama_siswa" name="nama_siswa" required placeholder="Masukkan nama lengkap"></td>
            </tr>
            <tr>
                <td><label for="no_hp">No. HP</label></td>
                <td>:</td>
                <td><input type="tel" id="no_hp" name="no_hp" placeholder="Contoh: 08123456789"></td>
            </tr>
            <tr>
                <td><label for="email">Email</label></td>
                <td>:</td>
                <td><input type="email" id="email" name="email" placeholder="Masukkan alamat email"></td>
            </tr>
            <tr>
                <td><label for="password">Kata Sandi</label></td>
                <td>:</td>
                <td><input type="password" id="password" name="password" placeholder="Masukkan kata sandi"></td>
            </tr>
            <tr>
                <td><label for="alamat">Alamat</label></td>
                <td>:</td>
                <td><textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat lengkap"></textarea></td>
            </tr>
            <tr>
                <td><label>Jenis Kelamin</label></td>
                <td>:</td>
                <td>
                    <input type="radio" id="pria" name="jenis_kelamin" value="Laki-laki">
                    <label for="pria">Laki-laki</label><br>
                    
                    <input type="radio" id="wanita" name="jenis_kelamin" value="Perempuan">
                    <label for="wanita">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td><label>Makanan Favorit</label></td>
                <td>:</td>
                <td>
                    <input type="checkbox" id="mie_ayam" name="makanan_favorit" value="Mie Ayam">
                    <label for="mie_ayam">Mie Ayam</label><br>
                    
                    <input type="checkbox" id="soto_ayam" name="makanan_favorit" value="Soto Ayam">
                    <label for="soto_ayam">Soto Ayam</label><br>
                    
                    <input type="checkbox" id="pangsit" name="makanan_favorit" value="Pangsit">
                    <label for="pangsit">Pangsit</label><br>
                    
                    <input type="checkbox" id="seblak" name="makanan_favorit" value="Seblak">
                    <label for="seblak">Seblak</label><br>
                    
                    <input type="checkbox" id="bakso" name="makanan_favorit" value="Bakso">
                    <label for="bakso">Bakso</label>
                </td>
            </tr>
            <tr>
                <td><label for="tanggal_lahir">Tanggal Lahir</label></td>
                <td>:</td>
                <td><input type="date" id="tanggal_lahir" name="tanggal_lahir"></td>
            </tr>
            <tr>
                <td><label for="jurusan">Jurusan</label></td>
                <td>:</td>
                <td>
                    <select id="jurusan" name="jurusan" required>
                        <option value="" disabled selected>-- Pilih Jurusan --</option>
                        <option value="TKJ">TKJ</option>
                        <option value="RPL">RPL</option>
                        <option value="PG">PG</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="foto_diri">Unggah Foto Diri</label></td>
                <td>:</td>
                <td><input type="file" id="foto_diri" name="foto_diri" accept="image/*"></td>
            </tr>
            <tr>
                <td colspan="3" style="text-align: right;">
                    <button type="submit">Kirim Data</button>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>z
